plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hermes.schetchiki'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hermes.schetchiki'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Зависимостей нет: WebView — часть системы.
