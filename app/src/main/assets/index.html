<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Счётчики">
<title>Счётчики · кв. 197</title>

<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Счётчики 197 — тёплая ретро-палитра ===== */
:root{
  --bg:#171210;
  --bg2:#1f1815;
  --card:#2a211c;
  --card2:#332821;
  --line:#453529;
  --text:#f2e9dc;
  --muted:#a8978a;
  --brass:#c9a227;
  --brass2:#e2c158;
  --green:#7fa650;
  --cold:#5aa9c9;
  --hot:#d0714f;
  --elec:#d9b53c;
  --gas:#9a8fd0;
  --danger:#d05252;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:16px/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none !important}

/* ---------- шапка ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#241b17 0%,#1b1512 100%);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .plate{
  width:44px;height:30px;border-radius:6px;flex:0 0 auto;
  background:linear-gradient(180deg,#f3ead7,#d9cdb4);
  color:#2a2118;font-weight:800;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.5);
  font-variant-numeric:tabular-nums;
}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px}

/* ---------- навигация по месяцам ---------- */
.monthbar{display:flex;align-items:center;gap:8px;margin-top:10px}
.monthbar .nav{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.monthbar .nav:active{background:var(--card2)}
.monthbar .mbtn{
  flex:1;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);text-align:center;font-weight:600;font-size:15px;
}
.monthbar input[type=month]{
  flex:1;height:40px;border-radius:12px;border:1px solid var(--brass);
  background:var(--card);padding:0 10px;color-scheme:dark;
}

/* ---------- карточки ---------- */
main{padding:12px 12px 20px;max-width:720px;margin:0 auto}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- поля показаний ---------- */
.field{padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field .name{font-weight:600;font-size:15px}
.field .acc{color:var(--muted);font-size:11.5px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.field .row{display:flex;align-items:center;gap:10px;margin-top:8px}
.field input[type=text]{
  flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);padding:0 14px;font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.5px;
}
.field input[type=text]:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.field input.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(208,82,82,.15)}
.field input.sus{border-color:#e3a15b;box-shadow:0 0 0 3px rgba(227,161,91,.18)}

/* шарик «Мои денюжки» — только transform/opacity */
/* ---------- шарики «Мои денюжки» ---------- */
.balloon{
  position:fixed;bottom:-140px;margin-left:-38px;z-index:1500;
  pointer-events:none;will-change:transform;
  animation:balloonUp var(--dur,2.6s) cubic-bezier(.35,.28,.45,1) forwards;
}
.balloon-body{
  position:relative;width:76px;height:94px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:10.5px;font-weight:800;line-height:1.1;color:#fff;letter-spacing:.02em;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:
    radial-gradient(circle at 34% 23%,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 25%),
    radial-gradient(circle at 38% 28%,var(--c1,#8df0aa) 0%,var(--c2,#4cc96f) 46%,var(--c3,#0f5f2c) 100%);
  border-radius:50% 50% 47% 47% / 57% 57% 43% 43%;
  box-shadow:0 8px 16px rgba(0,0,0,.32),
             inset -7px -9px 16px rgba(0,0,0,.2),
             inset 5px 7px 12px rgba(255,255,255,.2);
  will-change:transform,opacity;
}
.balloon-body .knot{
  position:absolute;bottom:-8px;left:50%;margin-left:-6px;width:12px;height:11px;
  background:var(--c3,#0f5f2c);border-radius:2px 2px 6px 6px;
}
.balloon-body .mb-string{
  position:absolute;bottom:-58px;left:50%;margin-left:-10px;width:20px;height:52px;
  opacity:.9;
}
.balloon.pop .balloon-body{animation:ballPop .22s ease-out forwards}
@keyframes ballPop{
  0%{transform:scale(1);opacity:1}
  40%{transform:scale(1.38);opacity:.95}
  100%{transform:scale(.12);opacity:0}
}
@keyframes balloonUp{
  0%{transform:translate(0,0) rotate(-4deg);opacity:0}
  6%{opacity:1}
  30%{transform:translate(calc(var(--drift,0px) * .3),-30vh) rotate(3deg)}
  55%{transform:translate(calc(var(--drift,0px) * .7),-55vh) rotate(-3deg)}
  80%{transform:translate(var(--drift,0px),-78vh) rotate(2deg)}
  100%{transform:translate(calc(var(--drift,0px) * .9),-108vh) rotate(-2deg);opacity:1}
}

.btn{
  display:block;width:100%;height:52px;border-radius:14px;border:0;
  background:linear-gradient(180deg,var(--brass2),var(--brass));color:#2a2118;
  font-weight:800;font-size:16px;letter-spacing:.02em;
  box-shadow:0 3px 0 #8d7119,0 6px 14px rgba(0,0,0,.35);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d7119}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:#e88a8a;border:1px solid #6b3434;box-shadow:none;font-weight:600}
.btn.sm{height:42px;font-size:14px;border-radius:12px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

/* ---------- расчёт ---------- */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum .item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.sum .item .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sum .item .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.sum .item .d{font-size:12px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.total .lbl{color:var(--muted);font-size:14px}
.total .val{font-size:28px;font-weight:800;color:var(--brass2);font-variant-numeric:tabular-nums}

/* ---------- архив ---------- */
.arch{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.arch .head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;gap:10px}
.arch .m{font-weight:700;font-size:15px;text-transform:capitalize}
.arch .t{font-weight:800;color:var(--brass2);font-variant-numeric:tabular-nums;white-space:nowrap}
.arch .body{border-top:1px solid var(--line);padding:4px 14px 12px;display:none}
.arch.open .body{display:block}
.arch table{width:100%;border-collapse:collapse;font-size:13.5px}
.arch td{padding:6px 0;border-bottom:1px solid rgba(69,53,41,.5)}
.arch td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.arch tr.grp td{color:var(--brass2);font-weight:700;background:rgba(201,162,39,.05)}
.arch .acts{display:flex;gap:8px;margin-top:10px}

/* ---------- график ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;white-space:nowrap}
.chip.on{background:var(--brass);border-color:var(--brass);color:#2a2118;font-weight:700}
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.chart{display:block;min-width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stats .s{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px}
.stats .s .k{font-size:11.5px;color:var(--muted)}
.stats .s .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

/* ---------- настройки ---------- */
.tline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tline:last-child{border-bottom:0}
.tline .nm{font-size:14.5px}
.tline input{width:120px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:0 10px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.tline input:focus{outline:none;border-color:var(--brass)}
.tver{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tver .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.banner{background:#3a2a1c;border:1px solid #6b4a22;color:#f0c98a;border-radius:12px;padding:11px 12px;font-size:13px;margin-bottom:12px}

/* ---------- таббар ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(27,21,18,.97);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);
}
nav.tabs button{
  flex:1;background:none;border:0;color:var(--muted);padding:6px 2px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;border-radius:12px;
}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brass2)}

/* ---------- заставка: дверь 197 ---------- */
#splash{
  position:fixed;inset:0;z-index:1000;background:#0d0a08;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  animation:splashOut .45s ease 2.5s forwards;
}
#splash.gone{opacity:0 !important;visibility:hidden !important;animation:none !important}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
#splash .hall{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#3a2b21 0%,#1a1310 45%,#0b0806 100%)}
#splash .wall{position:absolute;inset:0;opacity:.35;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px);
}
#splash .doorwrap{position:relative;width:min(74vw,340px);aspect-ratio:.56;
  transform-origin:left center;will-change:transform,opacity;
  animation:doorOpen .85s cubic-bezier(.5,0,.75,0) 2s forwards;
}
@keyframes doorOpen{to{transform:scaleX(.05);opacity:.2}}
#splash svg.door{width:100%;height:100%;display:block}
#splash .glow{position:absolute;inset:0;background:radial-gradient(55% 42% at 50% 58%,#ffe6b0 0%,rgba(255,214,140,.25) 40%,transparent 72%);
  opacity:0;animation:glowIn .7s ease 2.15s forwards}
@keyframes glowIn{to{opacity:.6}}
/* акцент на номере: тёплая пульсация ореола (только opacity — дёшево) */
#splash .plateglow{animation:platePulse 2.2s ease-in-out infinite}
@keyframes platePulse{0%,100%{opacity:.55}50%{opacity:1}}
#splash .hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;color:#8b7a6c;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#splash .bar{position:absolute;bottom:calc(44px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:120px;height:2px;background:#2a211c;border-radius:2px;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8d7119,#e2c158);animation:load2s 2s linear forwards}
@keyframes load2s{to{width:100%}}

/* тост */
#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:900;
  background:#3a2e25;border:1px solid #5b4838;color:#f6ecdd;
  padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

'use strict';
/* ==== Счётчики: чистая логика (без DOM) ==== */

var COUNTERS = [
  { key: 'hv_toilet',  name: 'Холодная вода — туалет', short: 'ХВС туалет', unit: 'м³', res: 'cold', acc: '367312067' },
  { key: 'gv_toilet',  name: 'Горячая вода — туалет',  short: 'ГВС туалет', unit: 'м³', res: 'hot',  acc: '367301428' },
  { key: 'hv_kitchen', name: 'Холодная вода — кухня',  short: 'ХВС кухня',  unit: 'м³', res: 'cold', acc: '367310054' },
  { key: 'gv_kitchen', name: 'Горячая вода — кухня',   short: 'ГВС кухня',  unit: 'м³', res: 'hot',  acc: '367310044' },
  { key: 'elec',       name: 'Электроэнергия',         short: 'Свет',       unit: 'кВт·ч', res: 'elec', acc: '' },
  { key: 'gas',        name: 'Газ',                    short: 'Газ',        unit: 'м³', res: 'gas',  acc: '' }
];

var RESOURCES = {
  elec: { key: 'elec', name: 'Электроэнергия', short: 'Электро', unit: 'кВт·ч', priceKey: 'elec', color: '#d9b53c' },
  cold: { key: 'cold', name: 'Холодная вода (сумма)', short: 'ХВС', unit: 'м³', priceKey: 'cold', color: '#5aa9c9' },
  hot:  { key: 'hot',  name: 'Горячая вода (сумма)',  short: 'ГВС', unit: 'м³', priceKey: 'hot',  color: '#d0714f' },
  gas:  { key: 'gas',  name: 'Газ', short: 'Газ', unit: 'м³', priceKey: 'gas', color: '#9a8fd0' }
};
var RES_ORDER = ['elec', 'cold', 'hot', 'gas'];

var MONTHS_RU = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
var MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

function round(n, digits) {
  var f = Math.pow(10, digits === undefined ? 2 : digits);
  return Math.round(n * f) / f;
}

/* 'YYYY-MM' */
function monthKey(y, m) {
  m = Number(m);
  return y + '-' + (m < 10 ? '0' + m : '' + m);
}
function monthParts(mk) {
  var p = String(mk).split('-');
  return { y: Number(p[0]), m: Number(p[1]) };
}
function monthIndex(mk) {
  var p = monthParts(mk);
  return p.y * 12 + (p.m - 1);
}
function addMonths(mk, d) {
  var i = monthIndex(mk) + d;
  return monthKey(Math.floor(i / 12), (i % 12) + 1);
}
function monthLabel(mk) {
  var p = monthParts(mk);
  return MONTHS_RU[p.m - 1] + ' ' + p.y;
}
function monthShort(mk) {
  var p = monthParts(mk);
  return MONTHS_SHORT[p.m - 1] + ' ' + String(p.y).slice(2);
}
function currentMonth() {
  var d = new Date();
  return monthKey(d.getFullYear(), d.getMonth() + 1);
}

/* Ввод: "533,5" / "533.5" / "1 234,5" -> число | null */
function parseNum(v) {
  if (v === null || v === undefined) return null;
  var s = String(v).replace(/[\s\u00a0]/g, '').replace(',', '.');
  if (s === '') return null;
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  var n = Number(s);
  return isFinite(n) ? n : NaN;
}

function sortedMonths(records) {
  return Object.keys(records)
    .filter(function (m) { return /^\d{4}-\d{2}$/.test(m); })
    .sort(function (a, b) { return monthIndex(a) - monthIndex(b); });
}

function hasData(records, mk) {
  var r = records[mk];
  if (!r) return false;
  return COUNTERS.some(function (c) { return typeof r[c.key] === 'number' && isFinite(r[c.key]); });
}

/* ближайший предыдущий месяц, где есть это показание */
function prevValue(records, mk, key) {
  var ms = sortedMonths(records);
  var target = monthIndex(mk);
  var best = null;
  for (var i = 0; i < ms.length; i++) {
    if (monthIndex(ms[i]) >= target) break;
    var v = records[ms[i]][key];
    if (typeof v === 'number' && isFinite(v)) best = { month: ms[i], value: v };
  }
  return best;
}

function usage(records, mk, key) {
  var r = records[mk];
  if (!r) return null;
  var cur = r[key];
  if (typeof cur !== 'number' || !isFinite(cur)) return null;
  var pv = prevValue(records, mk, key);
  if (!pv) return null;
  return round(cur - pv.value, 3);
}

/* расход по ресурсу; для воды — сумма двух точек по тем, где есть база */
function resourceUsage(records, mk, res) {
  if (res === 'elec' || res === 'gas') return usage(records, mk, res);
  var keys = COUNTERS.filter(function (c) { return c.res === res; }).map(function (c) { return c.key; });
  var total = 0, any = false;
  keys.forEach(function (k) {
    var u = usage(records, mk, k);
    if (u !== null) { total += u; any = true; }
  });
  return any ? round(total, 3) : null;
}

/* все ли точки ресурса имеют базу (для пометки «неполная сумма») */
function resComplete(records, mk, res) {
  if (res === 'elec' || res === 'gas') return usage(records, mk, res) !== null;
  return COUNTERS.filter(function (c) { return c.res === res; })
    .every(function (c) { return usage(records, mk, c.key) !== null; });
}

/* СУММА ПОКАЗАНИЙ ресурса: туалет + кухня (как в таблице на бумаге) */
function readingsSum(records, mk, res) {
  var r = records[mk] || {};
  var keys = COUNTERS.filter(function (c) { return c.res === res; }).map(function (c) { return c.key; });
  var known = keys.map(function (k) { return r[k]; })
    .filter(function (v) { return typeof v === 'number' && isFinite(v); });
  return {
    sum: known.length ? round(known.reduce(function (a, b) { return a + b; }, 0), 3) : null,
    count: known.length,
    of: keys.length
  };
}

/* сумма показаний по произвольным значениям (для живого пересчёта в форме) */
function sumValues(vals) {
  var known = vals.filter(function (v) { return typeof v === 'number' && isFinite(v); });
  return { sum: known.length ? round(known.reduce(function (a, b) { return a + b; }, 0), 3) : null, count: known.length, of: vals.length };
}

/* тариф, действующий в месяце: последняя версия с from <= month */
function tariffFor(tariffs, mk) {
  if (!tariffs || !tariffs.length) return null;
  var idx = monthIndex(mk);
  var best = null;
  tariffs.forEach(function (t) {
    if (!t || !t.from) return;
    if (monthIndex(t.from) <= idx) {
      if (!best || monthIndex(t.from) > monthIndex(best.from)) best = t;
    }
  });
  if (!best) {
    var sorted = tariffs.slice().filter(function (t) { return t && t.from; })
      .sort(function (a, b) { return monthIndex(a.from) - monthIndex(b.from); });
    best = sorted[0] || null;
  }
  return best;
}

/* Полный расчёт месяца */
function monthSummary(data, mk) {
  var records = data.records || {};
  var tariffs = data.tariffs || [];
  var t = tariffFor(tariffs, mk);
  var out = { month: mk, readings: {}, usage: {}, res: {}, total: 0, complete: true, tariff: t, hasRecord: hasData(records, mk) };

  COUNTERS.forEach(function (c) {
    var r = records[mk] || {};
    out.readings[c.key] = (typeof r[c.key] === 'number' && isFinite(r[c.key])) ? r[c.key] : null;
    out.usage[c.key] = usage(records, mk, c.key);
  });

  var sum = 0;
  RES_ORDER.forEach(function (rk) {
    var u = resourceUsage(records, mk, rk);
    var price = t ? t[RESOURCES[rk].priceKey] : null;
    var cost = null;
    if (u !== null && typeof price === 'number' && isFinite(price)) cost = round(u * price, 2);
    out.res[rk] = { usage: u, price: (typeof price === 'number' ? price : null), cost: cost,
                    complete: resComplete(records, mk, rk),
                    readings: readingsSum(records, mk, rk) };
    if (cost === null) out.complete = false; else sum += cost;
  });
  out.total = out.hasRecord ? round(sum, 2) : null;
  if (out.total === 0 && !out.complete) out.total = null;
  return out;
}

function series(data) {
  return sortedMonths(data.records || {}).map(function (m) { return monthSummary(data, m); });
}

/* статистика по выбранному ряду */
function statsFor(data, key) {
  var list = series(data).map(function (s) {
    if (key === 'total') return { month: s.month, value: s.total };
    return { month: s.month, value: s.res[key] ? s.res[key].usage : null };
  }).filter(function (p) { return p.value !== null && p.value !== undefined; });

  if (!list.length) return { values: [], avg: null, last: null, prev: null, delta: null };
  var sum = list.reduce(function (a, p) { return a + p.value; }, 0);
  var last = list[list.length - 1], prev = list.length > 1 ? list[list.length - 2] : null;
  return {
    values: list,
    avg: round(sum / list.length, 2),
    last: last,
    prev: prev,
    delta: prev && prev.value ? round((last.value - prev.value) / prev.value * 100, 1) : null
  };
}

/* Форматирование чисел по-русски */
function fmt(n, digits) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  var d = digits === undefined ? 2 : digits;
  var neg = n < 0 ? '−' : '';
  var s = Math.abs(n).toFixed(d);
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
  var out = parts[0];
  if (d > 0) out += ',' + parts[1];
  return neg + out;
}
function fmtMoney(n) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  return fmt(n, 2) + '\u00a0₽';
}
function fmtUsage(n, unit) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  var digits = Math.abs(n) % 1 < 0.0001 ? 0 : 2;
  return fmt(n, digits) + '\u00a0' + unit;
}

/* CSV-экспорт */
function toCSV(data) {
  var rows = [];
  rows.push(['Месяц'].concat(COUNTERS.map(function (c) { return c.name + ', ' + c.unit; }))
    .concat(RES_ORDER.map(function (r) { return 'Расход ' + RESOURCES[r].name; }))
    .concat(RES_ORDER.map(function (r) { return 'Сумма ' + RESOURCES[r].name + ', ₽'; }))
    .concat(['Итого, ₽']));
  series(data).forEach(function (s) {
    var row = [s.month];
    COUNTERS.forEach(function (c) { row.push(s.readings[c.key] === null ? '' : String(s.readings[c.key]).replace('.', ',')); });
    RES_ORDER.forEach(function (r) { row.push(s.res[r].usage === null ? '' : String(s.res[r].usage).replace('.', ',')); });
    RES_ORDER.forEach(function (r) { row.push(s.res[r].cost === null ? '' : String(s.res[r].cost).replace('.', ',')); });
    row.push(s.total === null ? '' : String(s.total).replace('.', ','));
    rows.push(row);
  });
  return rows.map(function (r) {
    return r.map(function (cell) {
      var v = String(cell);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(';');
  }).join('\r\n');
}

<script>

});

var LS_KEY = 'meters_v1';
var storageOk = true;

  };
}

function $(id) { return document.getElementById(id); }

/* ================= ВВОД ================= */
function sumCard(s) {

      });

  return (storageOk ? '' : '<div class="banner">Браузер не даёт сохранить данные на диск. Работайте и сразу выгружайте бэкап в настройках.</div>') +

    '<div class="card"><h2>Показания</h2>' + fields + '</div>' +

/* ================= ГРАФИК ================= */
function chartSVG() {
  var st = statsFor(state.data, state.chartRes);
  var pts = st.values.slice(-12);
  var isMoney = state.chartRes === 'total';
  var unit = isMoney ? '₽' : (state.chartRes === 'elec' ? 'кВт·ч' : 'м³');
  if (!pts.length) return '<div class="note">Нет данных для графика — нужно хотя бы два месяца с показаниями.</div>';

  var bw = 24, gap = 22, padX = 14, top = 26;
  var w = Math.max(pts.length * (bw + gap) + padX * 2, 320);
  var h = 220, plotH = h - 74;
  var maxv = 0;
  pts.forEach(function (p) { if (p.value > maxv) maxv = p.value; });
  if (!(maxv > 0)) maxv = 1;
  var scale = function (v) { return plotH * v / maxv; };
  var color = isMoney ? '#c9a227' : RESOURCES[state.chartRes].color;

  var grid = '';
  for (var g = 0; g <= 2; g++) {
    var y = top + plotH * g / 2;
    grid += '<line x1="' + padX + '" y1="' + y + '" x2="' + (w - padX) + '" y2="' + y + '" stroke="#453529" stroke-width="1" stroke-dasharray="3 4"/>';
    grid += '<text x="' + padX + '" y="' + (y - 4) + '" fill="#7d6d61" font-size="9">' + fmt(maxv * (1 - g / 2), 0) + '</text>';
  }

  var bars = pts.map(function (p, i) {
    var x = padX + i * (bw + gap);
    var bh = Math.max(2, scale(p.value));
    var y = top + plotH - bh;
    var lbl = '<text x="' + (x + bw / 2) + '" y="' + (h - 10) + '" text-anchor="middle" fill="#a8978a" font-size="10">' + esc(monthShort(p.month)) + '</text>';
    var val = pts.length <= 8
      ? '<text x="' + (x + bw / 2) + '" y="' + (y - 6) + '" text-anchor="middle" fill="#d7c9b6" font-size="9.5">' + fmt(p.value, 0) + '</text>'
      : '';
    return '<g><rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="4" fill="' + color + '" opacity="' + (i === pts.length - 1 ? '1' : '.72') + '"/>' + val + lbl + '</g>';
  }).join('');

  return '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="График">' +
    grid + bars + '</svg></div>' +
    '<div class="note" style="margin-top:6px">Единица: ' + esc(unit) + '. Последние ' + pts.length + ' мес. Суммы — по тарифу каждого месяца.</div>';
}

/* ---------- проверка введённых значений ---------- */
function fmtTxt(n) { return fmt(n, Math.abs(n) % 1 < 0.0001 ? 0 : 2); }

/* шарик «Мои денюжки» улетает от кнопки */
/* ---- звук лопающегося шарика (Web Audio, без файлов) ---- */
var AC = null;

/* разблокировка звука внутри пользовательского жеста */
function unlockAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var b = AC.createBuffer(1, 1, AC.sampleRate);
    var s = AC.createBufferSource();
    s.buffer = b;
    s.connect(AC.destination);
    s.start(0);
  } catch (e) {}
}

function popSound(volume) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var t0 = AC.currentTime;

    /* хлопок: короткий шумовой всплеск */
    var dur = 0.13;
    var len = Math.ceil(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      var k = 1 - i / len;
      data[i] = (Math.random() * 2 - 1) * Math.pow(k, 4);
    }
    var src = AC.createBufferSource();
    src.buffer = buf;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1600 + Math.random() * 900;
    bp.Q.value = 0.9;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.22 * (volume || 1), t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(AC.destination);
    src.start(t0);

    /* низкий «пуф» */
    var o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(240, t0);
    o.frequency.exponentialRampToValueAtTime(70, t0 + dur * 1.1);
    var g2 = AC.createGain();
    g2.gain.setValueAtTime(0.12 * (volume || 1), t0);
    g2.gain.exponentialRampToValueAtTime(0.0008, t0 + dur * 1.2);
    o.connect(g2);
    g2.connect(AC.destination);
    o.start(t0);
    o.stop(t0 + dur * 1.4);
  } catch (e) { /* звук не критичен */ }
}

/* ---- шарики: волны 3+4+2+5, разные цвета ---- */
var PALETTES = [
  ['#9df5b6', '#4cc96f', '#0f5f2c'],
  ['#ffb0b0', '#e05555', '#7d1f1f'],
  ['#a9cdff', '#4a86e8', '#173a73'],
  ['#ffe89a', '#e2b93c', '#7d6414'],
  ['#e6b8ff', '#a15cd8', '#4a1d73'],
  ['#ffcfae', '#e07a3c', '#7d3a12'],
  ['#a9f2ea', '#3cc9b5', '#12665a'],
  ['#ffc0e0', '#e05c9e', '#7d1f52']
];

function flyBalloon(k) {
  var pal = PALETTES[k % PALETTES.length];
  var dur = 1.8 + Math.random() * 0.6;          /* 1.8–2.4 c */
  var left = 6 + Math.random() * 80;            /* % ширины */
  var drift = Math.round(Math.random() * 36 - 18);

  var b = document.createElement('div');
  b.className = 'balloon';
  b.style.left = left + 'vw';
  b.style.setProperty('--dur', dur.toFixed(2) + 's');
  b.style.setProperty('--drift', drift + 'px');
  b.style.setProperty('--c1', pal[0]);
  b.style.setProperty('--c2', pal[1]);
  b.style.setProperty('--c3', pal[2]);
  b.innerHTML =
    '<div class="balloon-body">' +
      '<span>Мои<br>денюжки</span>' +
      '<span class="knot"></span>' +
      '<svg class="mb-string" viewBox="0 0 20 52" aria-hidden="true">' +
        '<path d="M10 0 C 18 10, 2 18, 10 28 C 18 38, 4 44, 9 52" fill="none" stroke="' + pal[1] + '" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg>' +
    '</div>';
  document.body.appendChild(b);

  /* лопается у верха экрана */
  var popAt = dur * (0.74 + Math.random() * 0.14);
  setTimeout(function () {
    if (!b.parentNode) return;
    b.classList.add('pop');
    popSound(0.5);
    setTimeout(function () { if (b.parentNode) b.remove(); }, 260);
  }, popAt * 1000);

  setTimeout(function () { if (b.parentNode) b.remove(); }, dur * 1000 + 900);
}

function launchBalloons() {
  /* 15 шариков: стартуют рандомно в течение ~1 секунды, лопаются у верха */
  for (var i = 0; i < 15; i++) {
    (function (idx) {
      setTimeout(function () { flyBalloon(idx); }, Math.random() * 1100);
    })(i);
  }
}

/* «проверка дурака»: меньше прошлого или скачок на порядок */
function validateReadings() {
  var issues = [];
  COUNTERS.forEach(function (c) {
    var inp = $('in_' + c.key);
    if (!inp) return;
    var raw = inp.value.trim();
    if (raw === '') return;
    var n = parseNum(raw);
    if (isNaN(n) || n < 0) { issues.push(c.short + ': не число'); return; }
    var pv = prevValue(state.data.records, state.month, c.key);
    if (!pv) return;
    if (n < pv.value) {
      issues.push(c.short + ': ' + fmtTxt(n) + ' меньше прошлого ' + fmtTxt(pv.value));
    } else if (pv.value > 0 && n >= pv.value * 10) {
      issues.push(c.short + ': ' + fmtTxt(n) + ' вместо ' + fmtTxt(pv.value) +
        ' — в ' + Math.round(n / pv.value) + ' раза больше');
    }
  });
  return issues;
}

function bindFields() {
  COUNTERS.forEach(function (c) {
    var inp = $('in_' + c.key);
    if (!inp) return;
    inp.addEventListener('input', function () {
      var warn = $('warn_' + c.key);
      var n = parseNum(inp.value);
      var pv = prevValue(state.data.records, state.month, c.key);
      inp.classList.remove('bad');
      inp.classList.remove('sus');
      if (warn) warn.textContent = '';
      updateLiveSums();
      if (!warn || inp.value.trim() === '') return;
      if (isNaN(n)) { warn.textContent = 'не число'; inp.classList.add('bad'); return; }
      if (n < 0) { warn.textContent = 'отрицательное'; inp.classList.add('bad'); return; }
      if (!pv) return;
      if (n < pv.value) {
        warn.textContent = 'меньше прошлого (' + fmtTxt(pv.value) + ') — проверьте';
        inp.classList.add('bad');
        return;
      }
      if (pv.value > 0 && n >= pv.value * 10) {
        warn.textContent = 'в ' + Math.round(n / pv.value) + ' раза больше (' + fmtTxt(pv.value) + ') — проверьте';
        inp.classList.add('sus');
      }
    });
  });
  var accs = document.querySelectorAll('[data-acc]');
  for (var i = 0; i < accs.length; i++) {
    accs[i].addEventListener('change', function (e) {
      state.data.accounts[e.target.getAttribute('data-acc')] = e.target.value.trim();
      persist();
      toast('Лицевой счёт сохранён');
    });
  }
}

/* ---------- сохранение показаний ---------- */
function saveReadings(btn) {
  var mk = state.month;
  var obj = {};
  var any = false, bad = false;
  COUNTERS.forEach(function (c) {
    var inp = $('in_' + c.key);
    if (!inp) return;
    var raw = inp.value.trim();
    if (raw === '') return;
    var n = parseNum(raw);
    if (isNaN(n) || n < 0) { bad = true; return; }
    obj[c.key] = round(n, 3);
    any = true;
  });
  if (bad) { toast('Проверьте выделенные поля'); return; }
  if (!any) { toast('Введите хотя бы одно показание'); return; }

  /* проверка дурака: подтверждение при подозрительных числах */
  var issues = validateReadings();
  if (issues.length) {
    if (!confirm('Проверьте показания:\n\n• ' + issues.join('\n• ') +
      '\n\nЕсли всё введено верно, нажмите ОК.')) {
      toast('Сохранение отменено');
      return;
    }
  }

  state.data.records[mk] = obj;
  persist();
  unlockAudio();
  launchBalloons();
  toast('Сохранено: ' + monthLabel(mk));
  render();
}

function deleteMonth(mk) {
  delete state.data.records[mk];
  persist();
  toast('Запись удалена');
  render();
}

/* ---------- скачивание файла ---------- */
function download(name, text, mime) {
  try {
    var blob = new Blob([text], { type: mime || 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}

function backupText() {
  return JSON.stringify({
    app: 'schetchiki-197', v: 1, exportedAt: new Date().toISOString(),
    records: state.data.records, tariffs: state.data.tariffs,
    accounts: state.data.accounts, settings: state.data.settings
  }, null, 2);
}

/* ================= ДЕЙСТВИЯ ================= */
function act(name, el) {
  switch (name) {
    case 'tab':
      state.tab = el.getAttribute('data-tab');
      render();
      window.scrollTo(0, 0);
      break;

    case 'prev-month':
      state.month = addMonths(state.month, -1); render(); break;
    case 'next-month':
      state.month = addMonths(state.month, 1); render(); break;

    case 'pick-month': {
      var host = el.parentNode;
      host.innerHTML = '<input type="month" value="' + esc(state.month) + '">';
      var inp = host.querySelector('input');
      inp.focus();
      inp.addEventListener('change', function () {
        if (inp.value) state.month = inp.value;
        render();
      });
      inp.addEventListener('blur', function () { setTimeout(render, 120); });
      break;
    }

    case 'save': saveReadings(el); break;

    case 'del-month':
      if (confirm('Удалить показания за ' + monthLabel(state.month) + '?')) deleteMonth(state.month);
      break;

    case 'del-record': {
      var mk = el.getAttribute('data-month');
      if (confirm('Удалить запись за ' + monthLabel(mk) + '?')) deleteMonth(mk);
      break;
    }

    case 'goto-input': state.tab = 'input'; render(); break;

    case 'toggle-arch': {
      var m2 = el.getAttribute('data-month');
      state.open[m2] = !state.open[m2];
      render();
      break;
    }

    case 'edit-month':
      state.month = el.getAttribute('data-month');
      state.tab = 'input';
      render(); window.scrollTo(0, 0);
      break;

    case 'chart-res':
      state.chartRes = el.getAttribute('data-res');
      render();
      break;

    case 'save-tariff': {
      var from = $('t_from').value || state.month;
      var vals = {};
      var ok = true;
      ['elec', 'cold', 'hot', 'gas'].forEach(function (k) {
        var n = parseNum($('t_' + k).value);
        if (isNaN(n) || n < 0) ok = false;
        vals[k] = n;
      });
      if (!ok) { toast('Проверьте тарифы'); return; }
      vals.from = from;
      var idx = -1;
      state.data.tariffs.forEach(function (t, i) { if (t.from === from) idx = i; });
      if (idx >= 0) state.data.tariffs[idx] = vals; else state.data.tariffs.push(vals);
      persist();
      toast('Тариф с ' + monthLabel(from) + ' сохранён');
      render();
      break;
    }

    case 'edit-tariff': {
      var i2 = Number(el.getAttribute('data-i'));
      var t2 = state.data.tariffs[i2];
      if (!t2) return;
      $('t_elec').value = String(t2.elec).replace('.', ',');
      $('t_cold').value = String(t2.cold).replace('.', ',');
      $('t_hot').value = String(t2.hot).replace('.', ',');
      $('t_gas').value = String(t2.gas).replace('.', ',');
      $('t_from').value = t2.from;
      window.scrollTo(0, 0);
      toast('Заполнено — правьте и сохраняйте');
      break;
    }

    case 'export-json': {
      var fname = 'schetchiki-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      if (!download(fname, backupText(), 'application/json')) toast('Не удалось скачать — используйте «Показать текст»');
      else toast('Файл сохранён в «Загрузки»');
      break;
    }

    case 'export-csv': {
      var csv = '\ufeff' + toCSV(state.data);
      if (!download('schetchiki-' + new Date().toISOString().slice(0, 10) + '.csv', csv, 'text/csv;charset=utf-8')) toast('Не удалось скачать');
      else toast('CSV сохранён в «Загрузки»');
      break;
    }

    case 'show-backup': {
      var txt = backupText();
      var box = $('backupBox');
      if (box) box.remove();
      box = document.createElement('div');
      box.id = 'backupBox';
      box.className = 'card';
      box.innerHTML = '<h2>Текст бэкапа</h2><div class="note" style="margin-bottom:8px">Выделите всё, скопируйте и сохраните в заметки или отправьте себе.</div>' +
        '<textarea readonly style="width:100%;height:180px;border-radius:10px;border:1px solid #453529;background:#171210;color:#f2e9dc;padding:10px;font-size:11px">' + esc(txt) + '</textarea>' +
        '<div style="height:8px"></div><button class="btn ghost sm" data-act="close-backup">Закрыть</button>';
      $('main').prepend(box);
      box.scrollIntoView({ behavior: 'smooth' });
      break;
    }
    case 'close-backup': {
      var b = $('backupBox'); if (b) b.remove(); break;
    }

    case 'import-json': {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = function () {
        var f = input.files && input.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var d = JSON.parse(String(fr.result));
            if (!d || typeof d !== 'object' || !d.records) throw new Error('bad');
            if (!confirm('Заменить текущие данные бэкапом (' + Object.keys(d.records).length + ' записей)?')) return;
            state.data = {
              v: 1,
              records: d.records || {},
              tariffs: (d.tariffs && d.tariffs.length) ? d.tariffs : defaultData().tariffs,
              accounts: d.accounts || defaultData().accounts,
              settings: d.settings || { splash: true }
            };
            persist(); toast('Данные загружены'); render();
          } catch (e) { toast('Файл не подходит'); }
        };
        fr.readAsText(f);
      };
      input.click();
      break;
    }

    case 'clear-all':
      if (confirm('Удалить все показания, тарифы и счета? Действие нельзя отменить.')) {
        state.data = defaultData();
        persist(); toast('Всё очищено'); render();
      }
      break;

    case 'toggle-splash':
      state.data.settings.splash = !state.data.settings.splash;
      persist(); render();
      toast(state.data.settings.splash ? 'Заставка включена' : 'Заставка выключена');
      break;
  }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var name = el.getAttribute('data-act');
  if (!name) return;
  e.preventDefault();
  act(name, el);
});

/* ================= ЗАСТАВКА ================= */
(function splash() {
  var sp = $('splash');
  if (!sp) return;
  if (state.data.settings && state.data.settings.splash === false) { sp.classList.add('gone'); return; }
  sp.addEventListener('click', function () { sp.classList.add('gone'); });
  /* страховка: даже если что-то пошло не так, заставка уйдёт сама */
  setTimeout(function () { sp.classList.add('gone'); }, 3400);
})();

render();

</script>
<script>
/* PWA: работает только по http(s), на file:// молча пропускаем */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
